defaults:
  - data: lithos
  - model: simclr
  - _self_

seed: 42
# Checkpoints for this run go here; scripts/train.py appends the model name so
# different methods never overwrite each other's checkpoints.
output_dir: checkpoints/${model.name}

trainer:
  max_epochs: 10
  accelerator: auto # picks CUDA > MPS > CPU automatically
  devices: 1
  log_every_n_steps: 10

knn_eval:
  k: 20
  every_n_epochs: 1 # how often the OnlineKNNEvalCallback checks downstream accuracy

hydra:
  job:
    # Without this, Hydra silently `cd`s into outputs/.../ before running, which
    # breaks every relative path in this project (data.root, output_dir, ...).
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
