# Data pipeline config. `image_size` is the single source of truth for crop size --
# every model config references it as ${data.image_size} instead of repeating the
# number, which matters most for DINOv2 (its patch-masking math has to agree with the
# actual input resolution -- see models/dinov2.py's training_step).

# Where the downloaded+unzipped Kaggle dataset lives. Override on the command line
# (`python scripts/train.py data.root=/path/to/lithos`) or edit this once you know
# where you put it -- see README.md for the download instructions.
root: data/raw/lithos
csv_name: center_component.csv

image_size: 224
batch_size: 64
num_workers: 4

# Fractions of the *whole* dataset, split by thin section (not by patch) -- see
# src/lithos_ssl/data/splits.py for why.
val_fraction: 0.15
test_fraction: 0.15
seed: 42

label_column: Multiclass_label
# Cap on the labelled "reference bank" used by kNN evaluation (both the online
# during-training check and the final scripts/evaluate.py run) -- embedding the full
# train split for every kNN query would be unnecessarily slow, and a few thousand
# reference images is already plenty to get a stable accuracy estimate.
knn_reference_size: 2000
