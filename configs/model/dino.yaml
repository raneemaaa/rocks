name: dino

backbone_name: resnet18
hidden_dim: 512
bottleneck_dim: 64
output_dim: 2048
lr: 0.001
max_epochs: ${trainer.max_epochs}
momentum_start: 0.996
momentum_end: 1.0
warmup_teacher_temp_epochs: 5

# Passed to lithos_ssl.data.datamodule.build_ssl_transform (-> lightly's DINOTransform)
# alongside data.image_size.
transform:
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.05, 0.4]
  n_local_views: 6
